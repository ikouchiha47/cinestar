events {
    worker_connections 1024;
}

http {
    upstream ollama_backend {
        least_conn;
        server ollama-1:11434 max_fails=3 fail_timeout=30s;
        server ollama-2:11434 max_fails=3 fail_timeout=30s;
        # server ollama-3:11434 max_fails=3 fail_timeout=30s;
        # server ollama-4:11434 max_fails=3 fail_timeout=30s;
    }

    server {
        listen 11434;
        
        location / {
            proxy_pass http://ollama_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Increase timeouts for LLM processing
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            
            # Handle streaming responses
            proxy_buffering off;
            proxy_cache off;
        }
    }
}

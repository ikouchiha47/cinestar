events {
    worker_connections 2048;
}

http {
    # Ollama upstream with load balancing
    upstream ollama_backend {
        least_conn;
        server ollama:11434 max_fails=3 fail_timeout=30s;
        server ollama-2:11434 max_fails=3 fail_timeout=30s;  # backup flag makes it only used when primary is down
    }

    # Whisper upstream
    upstream whisper_backend {
        server whisper:9000 max_fails=3 fail_timeout=30s;
    }

    # Ollama load balancer
    server {
        listen 11434;

        location / {
            proxy_pass http://ollama_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Increase timeouts for LLM processing
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;

            # Handle streaming responses
            proxy_buffering off;
            proxy_cache off;
        }
    }

    # Whisper load balancer on port 9001
    server {
        listen 9001;

        # Increase timeouts for transcription requests
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        
        # Increase buffer sizes for large audio files
        client_max_body_size 100M;

        location / {
            proxy_pass http://whisper_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Handle large file uploads
            proxy_buffering off;
            proxy_request_buffering off;
            
            # Keep connections alive
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}

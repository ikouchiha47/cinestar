version: '3.8'

x-ollama: &ollama
  image: ollama/ollama:${OLLAMA_DOCKER_TAG:-latest}
  volumes:
    - ${OLLAMA_MODELS:-/Users/alexday/.ollama}:/root/.ollama
  environment: &env
    OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:--1}
    OLLAMA_LOAD_TIMEOUT: ${OLLAMA_LOAD_TIMEOUT:-5m}
    OLLAMA_MAX_LOADED_MODELS: 3
    OLLAMA_NUM_PARALLEL: 5
    OLLAMA_FLASH_ATTENTION: ${OLLAMA_FLASH_ATTENTION:-0}
    OLLAMA_DEBUG: ${OLLAMA_DEBUG:-1}
    OLLAMA_HOST: 0.0.0.0
  restart: unless-stopped
  deploy:
    resources:
      limits:
        memory: 6G
      reservations:
        memory: 4G
  entrypoint: >
    /bin/bash -c "
      ollama serve &
      wait
    "

services:
  ollama-1:
    <<: *ollama
    container_name: driller-ollama-1
    environment:
      <<: *env
      CUDA_VISIBLE_DEVICES: 0
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  ollama-2:
    <<: *ollama
    container_name: driller-ollama-2
    environment:
      <<: *env
      CUDA_VISIBLE_DEVICES: 1
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ollama-3:
  #   <<: *ollama
  #   container_name: driller-ollama-3
  #   environment:
  #     <<: *env
  #     CUDA_VISIBLE_DEVICES: 0
  #   healthcheck:
  #     test: ["CMD", "ollama", "list"]
  #     interval: 15s
  #     timeout: 10s
  #     retries: 5
  #     start_period: 30s
  # 
  # ollama-4:
  #   <<: *ollama
  #   container_name: driller-ollama-4
  #   environment:
  #     <<: *env
  #     CUDA_VISIBLE_DEVICES: 0
  #   healthcheck:
  #     test: ["CMD", "ollama", "list"]
  #     interval: 15s
  #     timeout: 10s
  #     retries: 5
  #     start_period: 30s

  ollama:
    container_name: driller-ollama-lb
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9001:11434"
    depends_on:
      ollama-1:
        condition: service_healthy
      ollama-2:
        condition: service_healthy
      # ollama-3:
      #   condition: service_healthy
      # ollama-4:
      #   condition: service_healthy
    restart: unless-stopped

  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    container_name: driller-whisper
    ports:
      - "9000:9000"
    environment:
      - ASR_MODEL=base.en
      - ASR_ENGINE=faster_whisper
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/"]
      interval: 30s
      timeout: 10s
      retries: 3

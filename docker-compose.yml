# Drillbit AI Services
# Docker Compose setup for the AI services required by Drillbit desktop app
# The Drillbit app itself runs as a native desktop application, not in Docker

version: '3.8'

x-ollama: &ollama
  image: ollama/ollama:${OLLAMA_DOCKER_TAG:-latest}
  volumes:
    - ${OLLAMA_MODELS:-~/.ollama}:/root/.ollama
  environment: &env
    OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:--1}
    OLLAMA_LOAD_TIMEOUT: ${OLLAMA_LOAD_TIMEOUT:-5m}
    OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-3}
    OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-5}
    OLLAMA_FLASH_ATTENTION: ${OLLAMA_FLASH_ATTENTION:-0}
    OLLAMA_DEBUG: ${OLLAMA_DEBUG:-0}
    OLLAMA_HOST: 0.0.0.0
  restart: unless-stopped
  deploy:
    resources:
      limits:
        memory: 6G
      reservations:
        memory: 4G

services:

  # Secondary Ollama instance for load balancing
  ollama-2:
    <<: *ollama
    container_name: drillbit-ollama-2
    environment:
      <<: *env
      CUDA_VISIBLE_DEVICES: ${CUDA_DEVICE_2:-0}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Unified nginx proxy for both Ollama and Whisper services
  nginx-lb:
    container_name: drillbit-nginx-lb
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${OLLAMA_LB_PORT:-11435}:11434"  # Ollama proxy
      - "${WHISPER_LB_PORT:-9001}:9001"   # Whisper proxy
    depends_on:
      ollama:
        condition: service_healthy
      ollama-2:
        condition: service_healthy
      whisper:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9001/"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Main Ollama service (single instance)
  ollama:
    <<: *ollama
    container_name: drillbit-ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Whisper transcription service
  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    container_name: drillbit-whisper
    ports:
      - "${WHISPER_PORT:-9000}:9000"
    environment:
      - ASR_MODEL=${WHISPER_MODEL:-base.en}
      - ASR_ENGINE=${WHISPER_ENGINE:-faster_whisper}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

volumes:
  ollama_models:
    driver: local

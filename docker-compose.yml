# Drillbit AI Services
# Docker Compose setup for the AI services required by Drillbit desktop app
# The Drillbit app itself runs as a native desktop application, not in Docker

version: '3.8'

x-ollama: &ollama
  image: ollama/ollama:${OLLAMA_DOCKER_TAG:-latest}
  volumes:
    - ${OLLAMA_MODELS:-~/.ollama}:/root/.ollama
  environment: &env
    OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-5m}
    OLLAMA_LOAD_TIMEOUT: ${OLLAMA_LOAD_TIMEOUT:-5m}
    OLLAMA_MAX_LOADED_MODELS: ${OLLAMA_MAX_LOADED_MODELS:-2}
    OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-3}
    OLLAMA_FLASH_ATTENTION: ${OLLAMA_FLASH_ATTENTION:-0}
    OLLAMA_DEBUG: ${OLLAMA_DEBUG:-0}
    OLLAMA_HOST: 0.0.0.0
  restart: unless-stopped
  deploy:
    resources:
      limits:
        memory: 8G
      reservations:
        memory: 6G

services:

  # Embedding service Ollama (BGE-large, tinyllama for search)
  ollama-embed:
    <<: *ollama
    container_name: drillbit-ollama-embed
    # No external ports - nginx connects via internal Docker network
    environment:
      <<: *env
      OLLAMA_KEEP_ALIVE: -1  # Keep models loaded indefinitely
      # Share the same models directory as other Ollama instances
    volumes:
      - ${OLLAMA_MODELS:-~/.ollama}:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 4G
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "ollama serve &
       sleep 10 &&
       ollama pull qllama/bge-large-en-v1.5:latest &&
       ollama pull llama3.2:3b &&
       sleep 5 &&
       echo 'Preloading Llama 3.2:3b...' &&
       curl -s http://localhost:11434/api/generate -d '{\"model\":\"llama3.2:3b\",\"prompt\":\"test\",\"stream\":false}' > /dev/null &&
       echo 'Llama 3.2:3b loaded and ready' &&
       wait"

  # Vision/Captioning service Ollama (moondream:v2)
  ollama-caption:
    <<: *ollama
    container_name: drillbit-ollama-caption
    # No external ports - nginx connects via internal Docker network
    environment:
      <<: *env
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "ollama serve &
       sleep 10 &&
       ollama pull moondream:v2 &&
       wait"

  nginx-lb:
    container_name: drillbit-nginx-lb
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${OLLAMA_LB_PORT:-9001}:9001"    # Ollama load balancer
    depends_on:
      ollama-embed:
        condition: service_healthy
      ollama-caption:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Whisper transcription service
  whisper:
    image: onerahmet/openai-whisper-asr-webservice:latest
    container_name: drillbit-whisper
    ports:
      - "${WHISPER_PORT:-9000}:9000"
    environment:
      - ASR_MODEL=${WHISPER_MODEL:-base.en}
      - ASR_ENGINE=${WHISPER_ENGINE:-faster_whisper}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

volumes:
  ollama_models:
    driver: local
